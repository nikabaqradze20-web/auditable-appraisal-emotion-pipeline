[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditable-appraisal-emotion-pipeline"
version = "0.2.0"
description = "Offline reference implementation of an auditable two-pass appraisal annotation pipeline with a fixed emotion map."
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.25,<5"]

[tool.pytest.ini_options]
pythonpath = ["src"]

