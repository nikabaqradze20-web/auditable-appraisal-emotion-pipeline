[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditable-appraisal-emotion-pipeline"
version = "0.1.0"
description = "A small, offline, auditable four-layer appraisal and emotion annotation pipeline."
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.25,<5"]

[tool.pytest.ini_options]
pythonpath = ["src"]

